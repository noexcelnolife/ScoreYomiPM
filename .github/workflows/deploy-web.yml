# GitHub Pages への公開。
#
# WHY push でも起動するか（D-W19）: workflow_dispatch は**既定ブランチにワークフローが無いと
# 起動できない**（API は 404）。このワークフローは main に載せない方針なので、main に載るまでの
# あいだは feature/web への push でも起動できるようにする。壊れたビルドは build ジョブで
# 止まり、upload/deploy まで進まないため、壊れたものが公開されることはない。
#
# WHY tool/build_web.mjs を通すか: Web ビルドは 3 つの前提を同時に満たさないと壊れる（D-W17）。
#   1. OCR 資産の生成（web/ocr_vendor/ は追跡外）
#   2. --base-href（無いとサブパスで真っ白）
#   3. --no-web-resources-cdn（無いと CanvasKit を gstatic から取る）
# スクリプトはビルド後に 1 と 3 を検査し、外れていれば終了コード 1 で止まる。
name: Deploy Web

on:
  push:
    branches:
      - feature/web
    # 文書だけの変更でデプロイし直さない。ワークフロー自体の変更は除外しない。
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      ref:
        description: 'ビルドするブランチまたはタグ（空なら実行した ref）'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は直列化する。同時実行すると Pages のデプロイが競合する。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Node.js を用意
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Flutter を用意
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: 依存を取得
        run: flutter pub get

      # 壊れたものを公開しないための関門。docs/ground_truth_template.csv は追跡外なので、
      # 該当テストは skip される（D-W15）。
      - name: 静的解析
        run: flutter analyze

      - name: テスト
        run: flutter test

      - name: Web 配布物を作る
        env:
          # tool/build_web.mjs の既定は Windows の開発機のパス。CI では PATH 上の flutter を使う。
          FLUTTER: flutter
        run: node tool/build_web.mjs --base-href /ScoreYomiPM/

      - name: Pages の設定を読む
        uses: actions/configure-pages@v5
        with:
          # Pages サイトが未作成なら作らせる。作成済みなら設定を読むだけなので無害。
          # このリポジトリでは新規作成が 403 で拒否されたため、2026-11-25 に
          # Settings → Pages の Source を GitHub Actions にしてもらった（D-W20）。
          #   GITHUB_TOKEN（pages: write 付き）→ Resource not accessible by integration
          #   PAT                              → Resource not accessible by personal access token
          enablement: true

      - name: 成果物をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      # 既定の `github-pages` を使わない。
      # WHY: Settings から Pages を有効化すると、GitHub は `github-pages` 環境に
      # 「main からの配布のみ許可」という保護ルールを自動で付ける（2026-11-25 実測:
      # deployment-branch-policies は main の 1 件のみ）。その状態で feature/web から配布すると
      #   Branch "feature/web" is not allowed to deploy to github-pages due to environment protection rules.
      # でジョブが開始前に落ちる。許可ブランチの追加はリポジトリ管理者権限が要り、PAT では 403。
      # 公式ドキュメントは「必要なら別の環境名でもよい（推奨はしない）」と明記しており、
      # OIDC トークンの環境クレームはここで指定した名前で検証される。
      # main へマージしない方針の間だけこの名前を使い、マージ後に `github-pages` へ戻す。
      name: web-publish
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
